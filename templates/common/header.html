<header class="d-flex align-items-center gap-2 px-2 py-2 border-bottom">

        <!-- Só existe algo pra abrir/fechar abaixo de lg — acima disso o
             aside já fica permanentemente visível. -->
        <button class="btn btn-sm border-0 d-lg-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#appAside" aria-label="Abrir menu">
            <i class="bi bi-list fs-5"></i>
        </button>

        <span class="fw-semibold d-none d-sm-inline">planner py</span>

        <div class="flex-grow-1">
            <button class="btn btn-sm w-100 bg-secondary-subtle border-accent-subtle shadow text-start text-secondary" data-bs-toggle="modal" data-bs-target="#searchModal">
                <i class="bi bi-search"></i> <span class="d-none d-md-inline">Buscar...</span>
            </button>
        </div>

        <!-- No mobile, os mesmos dois botões já vivem dentro do drawer
             (common/aside.html) — evita duplicar/espremer o header estreito. -->
        <div class="d-none d-lg-flex gap-2">

            <button onclick="openExternal('https://github.com/NycolasGarcia')" class="btn btn-sm border-0">
                <i class="bi bi-github"></i>
            </button>

            <button class="btn btn-sm border-0 theme-toggle-btn">
                <i class="bi bi-moon"></i>
            </button>

        </div>
    </header>

<script src="{{ url_for('static', filename='js/theme_toggle.js') }}"></script>
