<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <!-- HEADER -->
      <div class="modal-header">
        <h5 class="modal-title" id="searchModalLabel">Buscar</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- BODY -->
      <div class="modal-body">
        <input type="text" class="form-control form-control-lg" id="globalSearchInput" placeholder="Digite para buscar...">
        <div class="mt-3" id="globalSearchResults"></div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
    // Notes (título / pasta / trecho no corpo) + Events (nome / mês / dia).
    // O endpoint /api/search devolve o resultado por módulo ("notes: {...}",
    // "events: {...}") pra outros tipos (Tasks, Projects...) entrarem depois
    // sem quebrar o formato.
    function escHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]));
    }

    const modal   = document.getElementById('searchModal');
    const input   = document.getElementById('globalSearchInput');
    const results = document.getElementById('globalSearchResults');
    let debounceTimer = null;
    let requestSeq = 0;

    function noteRowHtml(note, extra) {
        const icon = note.icon || 'bi-file-text';
        return `<button type="button" class="list-group-item list-group-item-action d-flex align-items-start gap-2" data-open-note="${note.id}">
                    <i class="${escHtml(icon)} mt-1 flex-shrink-0"></i>
                    <span class="overflow-hidden">
                        <span class="d-block text-truncate fw-semibold">${escHtml(note.title)}</span>
                        <span class="d-block text-truncate small text-muted">${extra}</span>
                    </span>
                </button>`;
    }

    function eventRowHtml(event, extra) {
        const icon = event.icon || 'bi-calendar-event';
        return `<button type="button" class="list-group-item list-group-item-action d-flex align-items-start gap-2" data-open-event="${event.id}">
                    <i class="${escHtml(icon)} mt-1 flex-shrink-0"></i>
                    <span class="overflow-hidden">
                        <span class="d-block text-truncate fw-semibold">${escHtml(event.name)}</span>
                        <span class="d-block text-truncate small text-muted">${extra}</span>
                    </span>
                </button>`;
    }

    // Task não tem ícone próprio (herda da TaskList — ver models/task.py),
    // então usa um genérico fixo aqui, igual o resto do app faz nos outros
    // pontos de link cross-módulo (ex: agenda de Eventos).
    function taskRowHtml(task, extra) {
        return `<button type="button" class="list-group-item list-group-item-action d-flex align-items-start gap-2"
                         data-open-task="${task.id}" data-open-task-list="${task.task_list_id}">
                    <i class="bi bi-check2-square mt-1 flex-shrink-0"></i>
                    <span class="overflow-hidden">
                        <span class="d-block text-truncate fw-semibold">${escHtml(task.name)}</span>
                        <span class="d-block text-truncate small text-muted">${extra}</span>
                    </span>
                </button>`;
    }

    function tasklistRowHtml(tasklist, extra) {
        const icon = tasklist.icon || 'bi-list-check';
        return `<button type="button" class="list-group-item list-group-item-action d-flex align-items-start gap-2" data-open-tasklist="${tasklist.id}">
                    <i class="${escHtml(icon)} mt-1 flex-shrink-0"></i>
                    <span class="overflow-hidden">
                        <span class="d-block text-truncate fw-semibold">${escHtml(tasklist.name)}</span>
                        <span class="d-block text-truncate small text-muted">${extra}</span>
                    </span>
                </button>`;
    }

    function sectionHtml(label, items, renderItem) {
        if (!items.length) return '';
        return `<div class="mb-3">
                    <span class="text-secondary small"><i class="bi bi-chevron-right"></i> ${label}</span>
                    <div class="list-group list-group-flush mt-1">
                        ${items.map(renderItem).join('')}
                    </div>
                </div>`;
    }

    function formatEventDate(isoDate) {
        const [y, m, d] = isoDate.split('-').map(Number);
        return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
    }

    function render(data) {
        const notes = data.notes || { title: [], folder: [], content: [] };
        const events = data.events || { name: [], month: [], day: [] };
        const tasks = data.tasks || { task: [], tasklist: [] };
        const html = [
            sectionHtml('Notas — Título', notes.title, n => noteRowHtml(n, n.folder_name || 'Sem pasta')),
            sectionHtml('Notas — Pasta', notes.folder, n => noteRowHtml(n, 'Pasta: ' + n.folder_name)),
            sectionHtml('Notas — Trecho', notes.content, n => noteRowHtml(n, escHtml(n.snippet))),
            sectionHtml('Eventos — Nome', events.name, e => eventRowHtml(e, formatEventDate(e.date_start))),
            sectionHtml('Eventos — Mês', events.month, e => eventRowHtml(e, formatEventDate(e.date_start))),
            sectionHtml('Eventos — Dia', events.day, e => eventRowHtml(e, formatEventDate(e.date_start))),
            sectionHtml('Tasks', tasks.task, t => taskRowHtml(t, t.task_list_name || 'Sem lista')),
            sectionHtml('Listas de tasks', tasks.tasklist, tl => tasklistRowHtml(tl, 'Lista de tasks')),
        ].join('');
        results.innerHTML = html || '<p class="text-muted small mb-0">Nenhum resultado.</p>';
        results.querySelectorAll('[data-open-note]').forEach(btn => {
            btn.addEventListener('click', () => openNoteResult(parseInt(btn.dataset.openNote)));
        });
        results.querySelectorAll('[data-open-event]').forEach(btn => {
            btn.addEventListener('click', () => openEventResult(parseInt(btn.dataset.openEvent)));
        });
        results.querySelectorAll('[data-open-task]').forEach(btn => {
            btn.addEventListener('click', () => openTaskResult(parseInt(btn.dataset.openTask), parseInt(btn.dataset.openTaskList)));
        });
        results.querySelectorAll('[data-open-tasklist]').forEach(btn => {
            btn.addEventListener('click', () => openTaskListResult(parseInt(btn.dataset.openTasklist)));
        });
    }

    function openNoteResult(noteId) {
        bootstrap.Modal.getInstance(modal)?.hide();
        if (window.__notesPage && typeof window.__notesPage.openNoteById === 'function') {
            window.__notesPage.openNoteById(noteId);
        } else {
            window.location.href = '/notes?open=' + noteId;
        }
    }

    function openEventResult(eventId) {
        bootstrap.Modal.getInstance(modal)?.hide();
        if (window.__eventsPage && typeof window.__eventsPage.openEventById === 'function') {
            window.__eventsPage.openEventById(eventId);
        } else {
            window.location.href = '/events?open=' + eventId;
        }
    }

    function openTaskResult(taskId, taskListId) {
        bootstrap.Modal.getInstance(modal)?.hide();
        if (window.__tasksPage && typeof window.__tasksPage.openTaskById === 'function') {
            window.__tasksPage.openTaskById(taskId, taskListId);
        } else {
            window.location.href = '/tasks?open_task=' + taskId + '&list=' + taskListId;
        }
    }

    function openTaskListResult(tasklistId) {
        bootstrap.Modal.getInstance(modal)?.hide();
        if (window.__tasksPage && typeof window.__tasksPage.openTaskListById === 'function') {
            window.__tasksPage.openTaskListById(tasklistId);
        } else {
            window.location.href = '/tasks?open_list=' + tasklistId;
        }
    }

    async function runSearch(q) {
        const seq = ++requestSeq;
        if (!q) { results.innerHTML = ''; return; }
        const data = await fetch('/api/search?q=' + encodeURIComponent(q)).then(r => r.json());
        if (seq !== requestSeq) return; // resposta antiga chegou depois de uma busca mais nova — descarta
        render(data);
    }

    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => runSearch(input.value.trim()), 300);
    });

    modal.addEventListener('shown.bs.modal', () => input.focus());
    modal.addEventListener('hidden.bs.modal', () => {
        input.value = '';
        results.innerHTML = '';
    });
})();
</script>
